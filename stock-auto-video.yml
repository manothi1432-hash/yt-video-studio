name: Stock Auto YouTube Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Enter Video Topic (e.g. Black Holes, Roman Concrete)'
        required: true
        type: string
      video_type:
        description: 'Choose Video Format'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long

jobs:
  build-stock-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Edge-TTS & Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts requests pillow google-genai

      - name: Render Stock Auto Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          VIDEO_TYPE: ${{ github.event.inputs.video_type }}
        run: python render_stock_auto.py

      - name: Upload Stock Video MP4
        uses: actions/upload-artifact@v4
        with:
          name: stock_video
          path: stock_video.mp4
