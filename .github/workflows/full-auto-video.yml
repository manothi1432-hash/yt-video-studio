name: Full Auto YouTube Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Enter Video Topic (e.g. The man who shipped ice)'
        required: true
        type: string
      video_type:
        description: 'Choose Video Format'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Edge-TTS, Playwright & Gemini
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts playwright pillow google-genai
          playwright install chromium

      - name: Generate Story from Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          VIDEO_TYPE: ${{ github.event.inputs.video_type }}
        run: python generate_story.py

      - name: Render Voiced Animated MP4
        run: python render_full_auto.py

      - name: Upload Final MP4
        uses: actions/upload-artifact@v4
        with:
          name: final_video
          path: final_video.mp4
