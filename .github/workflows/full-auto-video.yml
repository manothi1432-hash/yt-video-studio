name: Full Auto YouTube Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Edge-TTS, and Playwright
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts playwright pillow
          playwright install chromium

      - name: Render Voiced Animated MP4
        run: python render_full_auto.py

      - name: Upload Final MP4
        uses: actions/upload-artifact@v4
        with:
          name: final_video
          path: final_video.mp4
          
