name: Run Stick3dpack Remotion

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Enter Video Topic (e.g. Apple Lost $200B in 3 Days)'
        required: true
        type: string

jobs:
  render-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22 & Python 3.11
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Edge-TTS & Gemini
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg bc unzip
          pip install -U edge-tts gTTS google-genai

      - name: Unzip Pack & Run Setup
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          unzip -o "$ZIP_FILE"
          SETUP=$(find . -name "setup.sh" | head -n 1)
          chmod +x "$SETUP"
          bash "$SETUP"

      - name: Generate & Render Custom 3D Video from Topic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python3 auto_stick3d.py

      - name: Upload Final Remotion MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion_video
          path: remotion_video.mp4
